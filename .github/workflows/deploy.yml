name: Deploy to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT: ${{ secrets.GOOGLE_REDIRECT }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REDIRECT
          script: |
            cd /home/homefinder_backend
            git fetch origin main
            git reset --hard origin/main
            
            # Inject Google secrets into .env if they are provided
            if [ ! -z "$GOOGLE_CLIENT_ID" ]; then
              sed -i '/^GOOGLE_/d' .env
              echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" >> .env
              echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> .env
              echo "GOOGLE_REDIRECT=$GOOGLE_REDIRECT" >> .env
            fi
            
            # Rebuild and restart docker containers in background
            docker compose up -d --build
            
            # Run Laravel migrations (Wait a few seconds for DB to be ready)
            sleep 10
            docker exec homefinder_app php artisan migrate --force
            docker exec homefinder_app php artisan storage:link
            
            # Optimize Laravel
            docker exec homefinder_app php artisan optimize:clear
            docker exec homefinder_app php artisan config:cache
            docker exec homefinder_app php artisan route:cache
            docker exec homefinder_app php artisan view:cache
            
            # Auto-create/update Super Admin Account
            docker exec homefinder_app php artisan tinker --execute="\App\Models\User::updateOrCreate(['email' => 'admin@homefinder.id'], ['name' => 'Super Admin', 'password' => bcrypt('password123'), 'role' => 'superadmin']);"
