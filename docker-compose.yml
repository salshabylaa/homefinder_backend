version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: homefinder-backend:latest
    container_name: homefinder_app
    restart: always
    ports:
      - "80:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=true
    env_file:
      - .env
    volumes:
      - ./.env:/app/.env
      - ./storage:/app/storage
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: homefinder_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  db_data:

